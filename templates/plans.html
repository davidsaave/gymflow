{% extends "base.html" %}
{% block title %}Planes{% endblock %}
{% block content %}
<h1>Planes</h1>
<section class="grid2">
<form method="post" class="card">
  <h3>Nuevo plan</h3>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nombre<input name="name" required maxlength="40"></label>
  <label>Precio (CLP)<input type="number" name="price" required min="0" max="10000000"></label>
  <label>Duración (días)<input type="number" name="duration_days" required min="1" max="3650"></label>
  <button class="btn" type="submit">Crear plan</button>
</form>
<div class="card"><h3>Planes del gimnasio</h3>
<table><thead><tr><th>Plan</th><th>Precio</th><th>Días</th><th></th></tr></thead><tbody>
{% for p in rows %}<tr><td>{{ p.name }}</td><td>${{ '{:,}'.format(p.price).replace(',', '.') }}</td><td>{{ p.duration_days }}</td>
<td><form method="post" action="{{ url_for('plan_delete', plan_id=p.id) }}" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link" type="submit">Eliminar</button></form></td></tr>{% endfor %}
</tbody></table></div>
</section>
{% endblock %}
