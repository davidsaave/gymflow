{% extends "base.html" %}
{% block title %}Auditoría{% endblock %}
{% block content %}
<h1>Registro de auditoría</h1>
<p class="muted">Últimos 100 eventos del gimnasio.</p>
<div class="tablewrap"><table>
<thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th><th>IP</th></tr></thead><tbody>
{% for a in rows %}<tr><td>{{ a.ts }}</td><td>{{ a.email or '-' }}</td><td>{{ a.action }}</td><td>{{ a.detail }}</td><td>{{ a.ip }}</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
