{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<form method="post" class="card narrow">
  <h2>Crear cuenta del gimnasio</h2>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nombre del gimnasio<input name="gym_name" required maxlength="80" value="{{ gym_name }}"></label>
  <label>Correo del administrador<input type="email" name="email" required maxlength="120" value="{{ email }}" autocomplete="username"></label>
  <label>Contraseña (mínimo 10, con letras y números)<input type="password" name="password" required minlength="10" maxlength="200" autocomplete="new-password"></label>
  <label>Repetir contraseña<input type="password" name="confirm" required minlength="10" maxlength="200" autocomplete="new-password"></label>
  <button class="btn" type="submit">Crear cuenta</button>
</form>
{% endblock %}
