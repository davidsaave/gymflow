{% extends "base.html" %}
{% block title %}Equipo{% endblock %}
{% block content %}
<h1>Equipo</h1>
<section class="grid2">
<form method="post" class="card">
  <h3>Nuevo usuario</h3>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo<input type="email" name="email" required maxlength="120"></label>
  <label>Contraseña inicial (mínimo 10, letras y números)<input type="password" name="password" required minlength="10" maxlength="200" autocomplete="new-password"></label>
  <label>Rol<select name="role"><option value="staff">Recepción / entrenador</option><option value="admin">Administrador</option></select></label>
  <button class="btn" type="submit">Crear usuario</button>
</form>
<div class="card"><h3>Usuarios del gimnasio</h3>
<table><thead><tr><th>Correo</th><th>Rol</th><th></th></tr></thead><tbody>
{% for u in rows %}<tr><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{% if u.id != g.user.id %}<form method="post" action="{{ url_for('staff_delete', user_id=u.id) }}" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link" type="submit">Eliminar</button></form>{% endif %}</td></tr>{% endfor %}
</tbody></table></div>
</section>
{% endblock %}
